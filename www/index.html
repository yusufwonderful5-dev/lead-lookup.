<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Lead Lookup</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4f8;--card:#fff;--tx:#14162a;--mu:#6c7089;--bd:#e2e4ef;--ac:#5b5bf0;--ac2:#8b5cf6;--acs:#eeeeff;--ok:#0f9d6b;--wn:#b87400;--er:#d1432f;--sh:0 6px 24px rgba(40,40,100,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1020;--card:#181a30;--tx:#eceefc;--mu:#9296b5;--bd:#2a2d4a;--ac:#7c7cff;--ac2:#a78bfa;--acs:#23254a;--ok:#3ccf9a;--wn:#e8b04a;--er:#f08272;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1020;--card:#181a30;--tx:#eceefc;--mu:#9296b5;--bd:#2a2d4a;--ac:#7c7cff;--ac2:#a78bfa;--acs:#23254a;--ok:#3ccf9a;--wn:#e8b04a;--er:#f08272;--sh:0 6px 24px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-size:20px}
h1{font-size:21px;margin:0;line-height:1.2}.sub{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.step{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
label.drop{display:flex;align-items:center;gap:12px;border:2px dashed var(--bd);border-radius:12px;padding:16px;cursor:pointer;color:var(--mu)}
label.drop:hover,label.drop.over{border-color:var(--ac);background:var(--acs);color:var(--tx)}
input[type=file]{display:none}
.ld{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--mu)}
.ld b{color:var(--ok)}
.sr{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{flex:1 1 240px;min-width:0;border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;background:var(--bg);color:var(--tx);font:inherit}
input[type=text]:focus{outline:none;border-color:var(--ac)}
button{border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
button.g{background:var(--acs);color:var(--ac);padding:8px 12px;font-size:13px;border-radius:9px}
button.l{background:none;color:var(--mu);padding:0;font-weight:500;font-size:13px;text-decoration:underline}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
.hero .k{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.hero .u{font-size:20px;font-weight:700;word-break:break-all;margin:2px 0 10px;color:#fff;text-decoration:none;display:block}
.hero button{background:rgba(255,255,255,.2);padding:8px 14px;font-size:13px;margin-right:8px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;border:1px solid currentColor;margin-left:8px;vertical-align:middle}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}
.who{font-weight:700;margin-bottom:12px;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.f{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;background:var(--bg)}
.f.w{grid-column:1/-1}
.f .k{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.f .v{font-weight:600;word-break:break-word;font-size:15px}
.f button{padding:5px 10px;font-size:12px;flex:none}
.msg{color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
</style></head><body><main>
<div class="top"><div class="logo">🔎</div><div><h1>Lead Lookup</h1><div class="sub">Paste an email, get the store and all its details</div></div></div>

<div class="card"><div class="step">Step 1 · Upload your leads CSV</div>
<label class="drop" id="drop"><input type="file" id="file" accept=".csv" multiple><span style="font-size:24px">📄</span><span>Tap or drop your leads CSV here</span></label>
<div class="ld"><span id="status">No file loaded yet.</span><button class="l" id="clear" hidden>Clear saved list</button></div></div>

<div class="card"><div class="step">Step 2 · Search for email</div>
<div class="sr"><input type="text" id="q" placeholder="name@store.com" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="go">Search email</button></div></div>

<div id="out"></div>
<div id="toast">Copied</div>
</main>
<script>
var byEmail={},byDomain={},H=[];
var FIRST=["Title","Email","Platform","HQ Country","Category","Product Count","Avg Price (USD)","Phone","WhatsApp","Description"];
var $=function(i){return document.getElementById(i)};
function parse(t){var r=[],row=[],f="",q=false,i=0,c;t=t.replace(/^\uFEFF/,"");
for(;i<t.length;i++){c=t[i];
if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);f="";if(row.length>1||row[0]!=="")r.push(row);row=[]}
else f+=c}
if(f!==""||row.length){row.push(f);r.push(row)}return r}
function norm(d){return d.toLowerCase().trim().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/.*$/,"")}
function add(o){var d=norm(o.Domain||"");if(!d)return;o.__d=d;byDomain[d]=o;
(o.Email||"").toLowerCase().split(/[;,\s]+/).forEach(function(e){if(e)byEmail[e]=o})}
function status(){var n=Object.keys(byDomain).length;
$("status").innerHTML=n?"<b>"+n+" stores loaded</b> and ready to search.":"No file loaded yet.";$("clear").hidden=!n}
function save(){try{localStorage.setItem("leads",JSON.stringify(Object.keys(byDomain).map(function(k){return byDomain[k]})))}catch(e){}}
function load(list){var left=list.length;
Array.prototype.forEach.call(list,function(f){var rd=new FileReader();
rd.onload=function(){var t=parse(rd.result),h=t[0]||[];
if(h.indexOf("Domain")<0){$("status").textContent=f.name+" has no Domain column, so it was skipped."}
else{t.slice(1).forEach(function(r){var o={};h.forEach(function(k,i){if(k)o[k]=r[i]||""});add(o)});
h.forEach(function(k){if(k&&H.indexOf(k)<0)H.push(k)})}
if(--left==0){status();save()}};rd.readAsText(f)})}
try{var s=JSON.parse(localStorage.getItem("leads")||"[]");s.forEach(function(o){add(o);Object.keys(o).forEach(function(k){if(k!="__d"&&H.indexOf(k)<0)H.push(k)})});status()}catch(e){}
function lev(a,b){var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;
for(i=1;i<=a.length;i++){var c=[i];for(j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[b.length]}
function find(e){var d=e.split("@")[1]||"";
if(byEmail[e])return{k:"exact",o:byEmail[e]};
if(byDomain[d]||byDomain["www."+d])return{k:"domain",o:byDomain[d]};
var best=null,bs=99,base=d.replace(/\.[^.]+$/,"");
Object.keys(byDomain).forEach(function(x){var s=lev(base,x.replace(/\.[^.]+$/,""));if(s<bs){bs=s;best=x}});
return best&&bs<=2?{k:"near",o:byDomain[best]}:{k:"none"}}
function toast(){var t=$("toast");t.classList.add("on");setTimeout(function(){t.classList.remove("on")},1100)}
function copy(s){try{navigator.clipboard.writeText(s).then(toast,fb)}catch(e){fb()}
function fb(){var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast()}catch(e){}a.remove()}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function cbtn(txt,get,cls){var b=el("button",cls||"g",txt);b.onclick=function(){copy(get())};return b}
function field(k,v,wide){var d=el("div","f"+(wide?" w":"")),w=el("div");w.appendChild(el("div","k",k));w.appendChild(el("div","v",v));d.appendChild(w);d.appendChild(cbtn("Copy",function(){return v}));return d}
function card(e){var r=find(e),c=el("div","card"),who=el("div","who",e);
if(r.k=="none"){var t=el("span","tag er","Not found");who.appendChild(t);c.appendChild(who);
c.appendChild(el("div","msg","No match in the loaded list. It may be in another leads file, or the spelling may differ."));return c}
var o=r.o,url="https://"+o.__d;
var t=el("span","tag "+(r.k=="near"?"wn":"ok"),r.k=="exact"?"Exact match":r.k=="domain"?"Same domain":"Similar domain, check");who.appendChild(t);c.appendChild(who);
var hero=el("div","hero");hero.appendChild(el("div","k","Store link"));
var a=el("a","u",url);a.href=url;a.target="_blank";a.rel="noopener";hero.appendChild(a);
hero.appendChild(cbtn("Copy link",function(){return url},""));
hero.appendChild(cbtn("Copy all details",function(){return all(o,url)},""));c.appendChild(hero);
var g=el("div","grid"),keys=FIRST.concat(H.filter(function(k){return FIRST.indexOf(k)<0&&k!="Domain"}));
keys.forEach(function(k){var v=(o[k]||"").trim();if(v)g.appendChild(field(k,v,k=="Description"||k=="Title"))});
c.appendChild(g);return c}
function all(o,url){var L=["Store link: "+url];FIRST.concat(H.filter(function(k){return FIRST.indexOf(k)<0&&k!="Domain"})).forEach(function(k){if((o[k]||"").trim())L.push(k+": "+o[k].trim())});return L.join("\n")}
function run(){var out=$("out");out.innerHTML="";
var ems=($("q").value.match(/[^\s,;<>]+@[^\s,;<>]+/g)||[]).map(function(x){return x.toLowerCase()});
ems=ems.filter(function(x,i){return ems.indexOf(x)==i});
if(!Object.keys(byDomain).length){out.appendChild(el("div","card msg","Upload your leads CSV first (Step 1)."));return}
if(!ems.length){out.appendChild(el("div","card msg","Paste a valid email address."));return}
ems.forEach(function(e){out.appendChild(card(e))})}
$("go").onclick=run;$("q").addEventListener("keydown",function(e){if(e.key=="Enter")run()});
$("file").onchange=function(e){load(e.target.files)};
$("clear").onclick=function(){byEmail={};byDomain={};H=[];try{localStorage.removeItem("leads")}catch(e){}status();$("out").innerHTML=""};
var dz=$("drop");["dragover","dragenter"].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.add("over")})});
["dragleave","drop"].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.remove("over")})});
dz.addEventListener("drop",function(e){load(e.dataTransfer.files)});
</script></body></html>
